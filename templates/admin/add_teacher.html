<!DOCTYPE html>
<html>
<head>
    <title>Lehrer hinzufügen</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Neuen Lehrer registrieren</h2>
        <form method="post">
            <input type="text" name="new_username" placeholder="Benutzername" required>
            <input type="password" name="new_password" placeholder="Passwort" required>
            <button type="submit">Lehrer anlegen</button>
        </form>
        <br>
        <a href="/dashboard">Abbrechen</a>
    </div>
</body>
</html>
