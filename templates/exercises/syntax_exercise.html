<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satzbau-Trainer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .exercise-container { max-width: 800px; margin: 50px auto; text-align: center; }

        /* Die Buttons sollen wie Text aussehen */
        .sentence-part-btn {
            display: inline;
            background: none;
            border: none;
            padding: 2px 5px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, transform 0.1s;
            color: #212529;
            text-decoration: underline decoration-transparent;
        }

        .sentence-part-btn:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
        }

        .correct-flash { background-color: #d4edda !important; color: #155724 !important; }
        .wrong-flash { background-color: #f8d7da !important; color: #721c24 !important; }

        #hint-box { min-height: 60px; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container exercise-container">
    <h2 class="mb-4">Satzbau-Trainer</h2>
    <div class="alert alert-info" role="alert">
        Anweisung: <strong>Klicke auf {{ target_label }}!</strong>
    </div>

    <div id="sentence-display" class="mb-5 p-4 border rounded bg-light">
        {% for part in sentence_parts %}
            <button class="sentence-part-btn"
                    data-type="{{ part.type }}"
                    onclick="checkAnswer(this)">
                {{ part.text }}
            </button>
        {% endfor %}
    </div>

    <div id="hint-box">
        <div id="error-message" class="alert alert-warning hidden">
            <strong>Hinweis:</strong> Ein Gliedsatz (GS) beginnt oft mit einer Konjunktion (weil, dass, obwohl) oder einem Relativpronomen. Das konjugierte Verb steht meist am Ende.
        </div>
    </div>
</div>

<script>
    const targetType = "{{ target_type }}";
    const fullSentence = "{{ full_sentence }}";
    let errorLogged = false;

    function checkAnswer(element) {
        const selectedType = element.getAttribute('data-type');

        if (selectedType === targetType) {
            // Richtig
            element.classList.add('correct-flash');
            setTimeout(() => {
                location.reload(); // Nächster Satz durch Reload
            }, 1000);
        } else {
            // Falsch
            element.classList.add('wrong-flash');
            document.getElementById('error-message').classList.remove('hidden');

            if (!errorLogged) {
                logError(selectedType);
                errorLogged = true;
            }
        }
    }

    async function logError(wrongType) {
        const errorData = {
            session_name: "{{ session.get('student_name', 'Unbekannt') }}",
            exercise: "Satzstruktur-Trainer",
            category: "Syntax",
            word: fullSentence,
            wrong_article: `Verwechselt ${wrongType} mit ${targetType}`
        };

        try {
            await fetch('/log_error', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(errorData)
            });
        } catch (err) {
            console.error("Fehler beim Logging:", err);
        }
    }
</script>

</body>
</html>
