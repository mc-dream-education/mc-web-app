<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Artikeltraining</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 50px; background-color: #fcfcfc; }
        .stats { font-size: 18px; margin-bottom: 20px; color: #666; }
        .feedback-message { height: 30px; color: #f39c12; font-size: 22px; margin-bottom: 10px; font-weight: 500; }
        .word-display { color: #008000; font-size: 48px; font-weight: bold; }
        .translation { color: #888; font-size: 20px; margin-bottom: 40px; }
        .btn-container { display: flex; justify-content: center; gap: 15px; }
        .category-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto; }
        
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: 1px solid #333; background: white; border-radius: 10px; font-weight: bold; }
        button:hover { background-color: #f0f0f0; }
        .btn-article { color: #0056b3; min-width: 120px; }
        .btn-category { background-color: #34495e; color: white; border: none; }
        .btn-category:hover { background-color: #2c3e50; }
        
        input { padding: 12px; font-size: 18px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="setup">
        <h2>Willkommen! Wie heißt du?</h2>
        <input type="text" id="username" placeholder="Dein Name...">
        <br>
        <button onclick="showCategories()">Weiter</button>
    </div>

    <div id="category-selection" class="hidden">
        <h2>Wähle ein Thema:</h2>
        <div id="category-list" class="category-container"></div>
    </div>

    <div id="game" class="hidden">
        <h1>Übung: <span id="display-category"></span></h1>
        <div class="stats">(richtig: <span id="correct-count">0</span> &nbsp; falsch: <span id="wrong-count">0</span>)</div>
        
        <div id="feedback" class="feedback-message"></div>
        
        <div class="word-display" id="current-word">---</div>
        <div class="translation" id="current-translation">---</div>

        <div class="btn-container">
            <button class="btn-article" onclick="checkAnswer('der')">der</button>
            <button class="btn-article" onclick="checkAnswer('die')">die</button>
            <button class="btn-article" onclick="checkAnswer('das')">das</button>
        </div>
    </div>

    <script>
        let currentData = {};
        let sessionName = "";
        let selectedCategory = "";
        let correctTotal = 0;
        let wrongTotal = 0;
        let hasFailedCurrentWord = false;

        function showCategories() {
            sessionName = document.getElementById('username').value;
            if(!sessionName) return alert("Bitte Namen eingeben");
            
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('category-selection').classList.remove('hidden');
            
            fetchCategories();
        }

        async function fetchCategories() {
            const response = await fetch('/get_categories');
            const categories = await response.json();
            const listDiv = document.getElementById('category-list');
            listDiv.innerHTML = "";
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.innerText = cat;
                btn.className = "btn-category";
                btn.onclick = () => startGame(cat);
                listDiv.appendChild(btn);
            });
        }

        function startGame(category) {
            selectedCategory = category;
            document.getElementById('category-selection').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('display-category').innerText = category;
            nextWord();
        }

        async function nextWord() {
            const response = await fetch(`/get_word?category=${selectedCategory}`);
            currentData = await response.json();
            hasFailedCurrentWord = false;
            document.getElementById('feedback').innerText = ""; 
            document.getElementById('current-word').innerText = currentData.word;
            document.getElementById('current-translation').innerText = currentData.translation;
        }

        async function checkAnswer(choice) {
            const feedbackElement = document.getElementById('feedback');
            
            if (choice === currentData.article) {
                if (!hasFailedCurrentWord) {
                    correctTotal++;
                    document.getElementById('correct-count').innerText = correctTotal;
                }
                nextWord();
            } else {
                feedbackElement.innerText = `${choice} ${currentData.word} ist falsch, probiere es noch einmal`;
                
                if (!hasFailedCurrentWord) {
                    wrongTotal++;
                    document.getElementById('wrong-count').innerText = wrongTotal;
                    hasFailedCurrentWord = true;

                    await fetch('/log_error', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            session_name: sessionName,
                            category: selectedCategory,
                            word: currentData.word,
                            wrong_article: choice
                        })
                    });
                }
            }
        }
    </script>
</body>
</html>
